<script>
// 利用規約・プライバシーポリシーの本文は、サーバー正本
// （GET /v1/terms・GET /v1/policy）を実行時に取得して描画する。
// このページに本文のコピーは持たない。取得できなかった場合は
// 本文を表示しない（フォールバックは用意しない）。
(function () {
  var API_BASE = "https://api-blmipi3saa-an.a.run.app/v1";

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderInline(s) {
    var anchors = [];
    var out = escapeHtml(s);
    out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, function (m, label, url) {
      anchors.push('<a href="' + url + '">' + label + "</a>");
      return "\u0001" + (anchors.length - 1) + "\u0002";
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/(https?:\/\/[^\s<\u0001\u0002（）()。、]+)/g,
      '<a href="$1">$1</a>');
    out = out.replace(/\u0001(\d+)\u0002/g, function (m, i) { return anchors[Number(i)]; });
    return out;
  }

  function renderMarkdown(md) {
    var blocks = md.replace(/\r\n/g, "\n").split(/\n\s*\n/);
    var html = "";
    blocks.forEach(function (raw, idx) {
      var block = raw.replace(/^\s+|\s+$/g, "");
      if (!block) return;
      var lines = block.split("\n");
      var first = lines[0];
      // 先頭の文書タイトル（# ）はページ側の見出しが担うため描画しない
      if (idx === 0 && /^# /.test(first)) {
        lines = lines.slice(1);
        if (!lines.length) return;
        block = lines.join("\n");
        first = lines[0];
      }
      var h;
      if ((h = /^## (.+)$/.exec(first)) && lines.length === 1) {
        html += "<h2>" + renderInline(h[1]) + "</h2>";
      } else if ((h = /^### (.+)$/.exec(first)) && lines.length === 1) {
        html += "<h3>" + renderInline(h[1]) + "</h3>";
      } else if (lines.every(function (l) { return /^- /.test(l); })) {
        html += "<ul>" + lines.map(function (l) {
          return "<li>" + renderInline(l.slice(2)) + "</li>";
        }).join("") + "</ul>";
      } else if (lines.every(function (l) { return /^\d+\. /.test(l); })) {
        html += "<ol>" + lines.map(function (l) {
          return "<li>" + renderInline(l.replace(/^\d+\. /, "")) + "</li>";
        }).join("") + "</ol>";
      } else {
        var text = lines.join("");
        var cls = "";
        if (/^制定日[:：]/.test(text)) cls = ' class="date"';
        else if (text === "株式会社スパイスエンジン") cls = ' class="sign"';
        html += "<p" + cls + ">" + renderInline(text) + "</p>";
      }
    });
    return html;
  }

  function loadLegalDoc(el) {
    fetch(API_BASE + el.getAttribute("data-legal-doc"))
      .then(function (res) {
        if (!res.ok) throw new Error("legal doc fetch failed: " + res.status);
        return res.json();
      })
      .then(function (doc) {
        if (!doc || typeof doc.text !== "string") return;
        el.innerHTML = renderMarkdown(doc.text);
      })
      .catch(function () {
        // フォールバックは用意しない。本文は表示しないままにする。
      });
  }

  document.querySelectorAll("[data-legal-doc]").forEach(loadLegalDoc);
})();
</script>
